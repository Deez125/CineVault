# CineVault in production. This is the file Coolify deploys.
#
# Two services from ONE image: the web app and the background worker. Both use the same
# Dockerfile output with a different command — see the Dockerfile header.
#
# Postgres is Supabase now. There is no local database container here, no cinevault-pgdata
# volume; every environment where this runs points DATABASE_URL at a hosted Supabase.
#
# Every secret comes from the environment. Coolify injects them from its own configuration,
# so nothing sensitive is in this file and nothing sensitive is in the repository.
#
# WHAT MUST BE SET IN COOLIFY BEFORE THE FIRST DEPLOY
#   APP_URL, DATABASE_URL, SESSION_SECRET,
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
#   STRIPE_SECRET_KEY, NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY, STRIPE_WEBHOOK_SECRET,
#   ADMIN_EMAILS, RESEND_API_KEY
#
# Anything marked `:?` below stops the deploy if it is missing, rather than starting a
# container that is quietly missing a feature.
#
# The app validates all of it at boot (see lib/env.ts) and refuses to start if something
# required is missing. A container that will not start is a far better failure than one
# that serves a broken checkout.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Compiled into the browser bundle, so it has to be present at BUILD time. All three
        # of these are publishable / anon-tier keys, safe to ship in a client bundle — that
        # is what they are FOR. The service-role Supabase key is deliberately absent from
        # build args (it must never reach the browser); it lives in `environment` only.
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    command: ["web"]
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?APP_URL must be set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}

      # Supabase Auth. The two NEXT_PUBLIC values are ALSO passed as build args above so
      # the client bundle can see them; they are duplicated here for server-side reads.
      # SERVICE_ROLE_KEY is server-only and never a build arg.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL must be set}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY must be set}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY must be set}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY must be set}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET must be set}

      PLEX_TOKEN: ${PLEX_TOKEN:-}
      PLEX_MACHINE_ID: ${PLEX_MACHINE_ID:-}
      PLEX_LIBRARY_SECTION_IDS: ${PLEX_LIBRARY_SECTION_IDS:-}
      PLEX_CLIENT_IDENTIFIER: ${PLEX_CLIENT_IDENTIFIER:-}
      PLEX_PROTECTED_USERS: ${PLEX_PROTECTED_USERS:-}

      # Supabase sends the transactional auth mail now, but the app itself still uses
      # RESEND_API_KEY to gate whether email verification is "on" (see emailConfigured()
      # in lib/email/index.ts), and lib/plex/link-ticket.ts HMACs with SESSION_SECRET.
      # Kept required; refusing to boot without it is deliberate.
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY must be set}
      EMAIL_FROM: "${EMAIL_FROM:-CineVault <noreply@getcinevault.com>}"
      EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-https://getcinevault.com/logo.png}

      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      ENABLE_DEBUG_PANEL: ${ENABLE_DEBUG_PANEL:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3000"
    healthcheck:
      # Hits the app itself rather than the port, so a process that is listening but broken
      # is reported as unhealthy instead of fine.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    command: ["worker"]
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}

      # The worker imports lib/env, and lib/env validates the Supabase vars as required.
      # Without them the worker refuses to start — same as the web container.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      PLEX_TOKEN: ${PLEX_TOKEN:-}
      PLEX_MACHINE_ID: ${PLEX_MACHINE_ID:-}
      PLEX_LIBRARY_SECTION_IDS: ${PLEX_LIBRARY_SECTION_IDS:-}
      PLEX_CLIENT_IDENTIFIER: ${PLEX_CLIENT_IDENTIFIER:-}
      PLEX_PROTECTED_USERS: ${PLEX_PROTECTED_USERS:-}

      # The worker calls assertEmailConfigured() on startup and will not run without this.
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY must be set}
      EMAIL_FROM: "${EMAIL_FROM:-CineVault <noreply@getcinevault.com>}"
      EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-https://getcinevault.com/logo.png}

      ADMIN_EMAILS: ${ADMIN_EMAILS:-}

      # The worker does not branch on this today, but letting the two services disagree
      # about whether verification is even on is a trap for whoever touches it next.
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}

      RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-300000}

      # Stream enforcement lives here, not in web. Defaults to false so a deploy can never
      # start killing streams on its own — it has to be turned on deliberately.
      ENFORCE_STREAM_LIMITS: ${ENFORCE_STREAM_LIMITS:-false}
      ENFORCE_INTERVAL_MS: ${ENFORCE_INTERVAL_MS:-20000}

      LOG_LEVEL: ${LOG_LEVEL:-info}
